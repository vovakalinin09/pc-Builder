services:
  app:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    environment:
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-root}
      - DB_PASS=${DB_PASS:-StrongP@ssw0rd}
      - DB_NAME=${DB_NAME:-pcbuilder}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:9.6
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-StrongP@ssw0rd}
      MYSQL_DATABASE: ${DB_NAME:-pcbuilder}
    ports:
      - "3307:3306"
    volumes:
      - ./db-scripts:/docker-entrypoint-initdb.d
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data: